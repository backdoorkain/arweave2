<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arweave Permaweb Uploader</title>
    <!-- SDK oficial de Arweave para navegadores -->
    <script src="https://unpkg.com"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        
        .container { width: 100%; max-width: 550px; background: #141b2d; border: 1px solid #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(to right, #2dd4bf, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        
        .status-container { display: flex; align-items: center; gap: 6px; }
        .badge { width: 8px; height: 8px; border-radius: 4px; background: #ef4444; }
        .badge.active { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-text { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #94a3b8; }
        .status-text.active { color: #10b981; }
        .section { margin-bottom: 20px; }
        .section-title { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { padding: 9px 16px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(to right, #14b8a6, #10b981); color: #0f172a; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; transform: none; opacity: 0.5; }
        
        .address-box { background: #1e293b; border: 1px solid rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; margin-top: 10px; display: none; }
        .address-label { font-size: 10px; color: #14b8a6; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 2px; }
        .address-val { font-family: monospace; font-size: 12px; color: #cbd5e1; word-break: break-all; }
        
        .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 110px; border: 2px dashed #334155; border-radius: 10px; cursor: pointer; background: rgba(11,15,25,0.3); transition: all 0.2s; padding: 10px; }
        .dropzone:hover { border-color: #14b8a6; background: rgba(11,15,25,0.6); }
        .dropzone svg { width: 28px; height: 28px; margin-bottom: 6px; fill: #64748b; }
        .dropzone:hover svg { fill: #14b8a6; }
        .dropzone p { font-size: 12px; color: #94a3b8; }
        .file-name { font-size: 11px; color: #14b8a6; font-family: monospace; margin-top: 4px; font-weight: 600; }
        
        .result-text { font-size: 12px; font-weight: 600; text-align: center; margin-top: 10px; min-height: 18px; }
        .list-container { display: none; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(26,35,51,0.5); border: 1px solid #1e293b; border-radius: 8px; }
        .item-info { display: flex; flex-direction: column; min-width: 0; padding-right: 8px; }
        .item-id { font-family: monospace; font-size: 11px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #475569; margin-top: 2px; }
        .meta-tag { background: #1e293b; color: #94a3b8; padding: 0px 4px; border-radius: 3px; font-family: monospace; font-size: 10px; }
        .link-action { font-size: 11px; font-weight: 600; color: #14b8a6; text-decoration: none; padding: 3px 6px; background: #0b0f19; border: 1px solid #1e293b; border-radius: 5px; }
        .link-action:hover { border-color: rgba(20,184,166,0.3); color: #34d399; }
        .placeholder-text { font-size: 12px; color: #475569; font-style: italic; text-align: center; padding: 15px; background: rgba(11,15,25,0.1); border-radius: 8px; border: 1px solid rgba(30,41,59,0.2); }
        .btn-refresh { font-size: 11px; color: #14b8a6; background: none; border: none; cursor: pointer; display: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Permaweb Uploader</h1>
                <p>Almacenamiento perpetuo y descentralizado</p>
            </div>
            <div class="status-container">
                <span class="badge" id="statusIndicator"></span>
                <span class="status-text" id="status">Desconectado</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>1. Identidad Web3</span>
                <button id="btnConnect" class="btn btn-primary">Conectar Wander</button>
            </div>
            <div id="addressBox" class="address-box">
                <span class="address-label">Dirección de Billetera</span>
                <span id="txtAddress" class="address-val">Ninguna</span>
            </div>
        </div>

        <div class="section" style="border-top: 1px solid #1e293b; padding-top: 15px;">
            <div class="section-title">2. Carga de Archivo</div>
            <label class="dropzone">
                <svg viewBox="0 0 24 24" xmlns="http://w3.org"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <p>Haz clic aquí para seleccionar un archivo</p>
                <p id="fileNameDisplay" class="file-name"></p>
                <input type="file" id="fileInput" style="display: none;" disabled />
            </label>
            <button id="btnSubmit" class="btn btn-primary" style="width: 100%; margin-top: 12px;" disabled>Firmar y Subir Archivo</button>
            <p id="uploadResult" class="result-text"></p>
        </div>

        <div class="section" style="border-top: 1px solid #1e293b; padding-top: 15px; margin-bottom: 0;">
            <div class="section-title">
                <span>3. Historial en la Permaweb (GraphQL)</span>
                <button id="btnRefresh" class="btn-refresh">Actualizar</button>
            </div>
            <div id="historyPlaceholder" class="placeholder-text">Conecta tu billetera para consultar tus cargas previas.</div>
            <div id="fileList" class="list-container"></div>
        </div>
    </div>
    <script>
        const arweave = window.Arweave.init({ host: 'arweave.net', port: 443, protocol: 'https' });
        let userAddress = "";

        const btnConnect = document.getElementById('btnConnect');
        const statusLabel = document.getElementById('status');
        const statusIndicator = document.getElementById('statusIndicator');
        const txtAddress = document.getElementById('txtAddress');
        const addressBox = document.getElementById('addressBox');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const btnSubmit = document.getElementById('btnSubmit');
        const uploadResult = document.getElementById('uploadResult');
        const historyPlaceholder = document.getElementById('historyPlaceholder');
        const fileList = document.getElementById('fileList');
        const btnRefresh = document.getElementById('btnRefresh');

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            fileNameDisplay.innerText = (files && files.length > 0) ? files[0].name : "";
        });

        btnConnect.addEventListener('click', async () => {
            if (!window.arweaveWallet) return alert("Instala la extensión Wander.");
            try {
                statusLabel.innerText = "Conectando...";
                await window.arweaveWallet.connect(["ACCESS_ADDRESS", "SIGN_TRANSACTION"]);
                userAddress = await window.arweaveWallet.getActiveAddress();
                
                txtAddress.innerText = userAddress;
                addressBox.style.display = "block";
                statusLabel.innerText = "Conectado";
                statusLabel.classList.add('active');
                statusIndicator.classList.add('active');
                
                fileInput.disabled = false;
                btnSubmit.disabled = false;
                btnConnect.innerText = "Desconectar";
                btnRefresh.style.display = "inline-block";
                fetchArweaveHistory();
            } catch (err) {
                console.error(err);
                statusLabel.innerText = "Error";
            }
        });

        btnSubmit.addEventListener('click', async () => {
            const files = fileInput.files;
            if (!files || files.length === 0) return alert("Selecciona un archivo.");
            
            const file = files[0];
            uploadResult.innerText = "Leyendo archivo...";
            uploadResult.style.color = "#14b8a6";
            
            try {
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (e) => {
                    try {
                        const arrayBuffer = e.target.result;
                        uploadResult.innerText = "Creando transacción...";

                        const transaction = await arweave.createTransaction({ data: arrayBuffer });
                        
                        // AGREGAMOS TAGS ESTÁNDAR DE INDEXACIÓN
                        transaction.addTag('Content-Type', file.type || 'application/octet-stream');
                        transaction.addTag('App-Name', 'MyMinimalUploaderApp'); // Tag de rastreo seguro

                        uploadResult.innerText = "Esperando firma en Wander...";
                        await arweave.transactions.sign(transaction, "use_wallet");
                        
                        uploadResult.innerText = "Transmitiendo datos...";
                        const response = await arweave.transactions.post(transaction);

                        if (response.status === 200 || response.status === 202) {
                            uploadResult.innerHTML = `¡Éxito! Archivo subido.<br><a href="https://viewblock.io{transaction.id}" target="_blank" style="color:#10b981; text-decoration:underline;">${transaction.id}</a>`;
                            uploadResult.style.color = "#10b981";
                            
                            // Guardamos inmediatamente en memoria local para que aparezca sin esperar a GraphQL
                            saveLocalTx(transaction.id, file.type || 'application/octet-stream', (nodeData = { size: arrayBuffer.byteLength }));
                        } else {
                            uploadResult.innerText = `Rechazado: ${response.status}`;
                            uploadResult.style.color = "#ef4444";
                        }
                    } catch (innerErr) {
                        uploadResult.innerText = "Error: " + innerErr.message;
                        uploadResult.style.color = "#ef4444";
                    }
                };
            } catch (err) {
                uploadResult.innerText = "Error: " + err.message;
                uploadResult.style.color = "#ef4444";
            }
        });

        // Función auxiliar para pintar cargas instantáneas antes del minado de GraphQL
        function saveLocalTx(id, mime, dataInfo) {
            const sizeKB = (dataInfo.size / 1024).toFixed(2);
            historyPlaceholder.style.display = "none";
            
            const localItem = `
                <div class="list-item" style="border-color: #10b981;">
                    <div class="item-info">
                        <span class="item-id" style="max-width:140px; color: #10b981;">${id} (Procesando...)</span>
                        <div class="item-meta">
                            <span class="meta-tag" style="background: #061c11; color: #34d399;">${mime}</span>
                            <span>• ${sizeKB} KB</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <a href="https://arweave.net{id}" target="_blank" class="link-action">Data</a>
                        <a href="https://viewblock.io{id}" target="_blank" class="link-action">Tx</a>
                    </div>
                </div>
            `;
            fileList.innerHTML = localItem + fileList.innerHTML;
            fileList.style.display = "flex";
        }

        async function fetchArweaveHistory() {
            if (!userAddress) return;
            historyPlaceholder.innerText = "Buscando cargas en GraphQL...";
            historyPlaceholder.style.display = "block";
            fileList.style.display = "none";

            // Query optimizada: Filtra por dueño y ordena de la más reciente a la más antigua
            const queryGQL = {
                query: `query { 
                    transactions(
                        owners: ["${userAddress}"], 
                        first: 10,
                        sort: HEIGHT_DESC
                    ) { 
                        edges { 
                            node { 
                                id 
                                data { size } 
                                tags { name value } 
                            } 
                        } 
                    } 
                }`
            };

            try {
                const response = await fetch("https://arweave.net", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(queryGQL)
                });
                const result = await response.json();
                const edges = result?.data?.transactions?.edges || [];

                if (edges.length === 0) {
                    historyPlaceholder.innerText = "No tienes transacciones previas en el índice de este nodo.";
                    return;
                }

                historyPlaceholder.style.display = "none";
                fileList.innerHTML = "";
                
                edges.forEach(edge => {
                    const node = edge.node;
                    const ctTag = node.tags.find(t => t.name.toLowerCase() === 'content-type');
                    const mime = ctTag ? ctTag.value : 'desconocido';
                    const sizeKB = node.data?.size ? (node.data.size / 1024).toFixed(2) : "0.00";

                    fileList.innerHTML += `
                        <div class="list-item">
                            <div class="item-info">
                                <span class="item-id" style="max-width:140px;">${node.id}</span>
                                <div class="item-meta">
                                    <span class="meta-tag">${mime}</span>
                                    <span>• ${sizeKB} KB</span>
                                </div>
                            </div>
                            <div class="item-actions">
                                <a href="https://arweave.net{node.id}" target="_blank" class="link-action">Data</a>
                                <a href="https://viewblock.io{node.id}" target="_blank" class="link-action">Tx</a>
                            </div>
                        </div>
                    `;
                });
                fileList.style.display = "flex";
            } catch (err) {
                console.error(err);
                historyPlaceholder.innerText = "Error al mapear el historial.";
            }
        }
        btnRefresh.addEventListener('click', fetchArweaveHistory);
    </script>
</body>
</html>
