<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subidor Arweave Minimalista</title>
    <!-- CORRECCIÓN 1: Enlace oficial y funcional al bundle de Arweave -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        button { padding: 10px 15px; cursor: pointer; margin-right: 10px; }
        #status { font-weight: bold; color: blue; }
    </style>
</head>
<body>

    <h2>Subidor Arweave Minimalista</h2>
    <p>Estado actual: <span id="status">Desconectado</span></p>

    <div class="box">
        <h3>1. Billetera Wander</h3>
        <button id="btnConnect">Conectar Wander</button>
        <p>Dirección: <span id="txtAddress">Ninguna</span></p>
    </div>

    <div class="box">
        <h3>2. Subir Archivo a la Permaweb</h3>
        <input type="file" id="fileInput" disabled><br><br>
        <button id="btnSubmit" disabled>Firmar y Subir Archivo</button>
        <p id="uploadResult"></p>
    </div>

    <script>
        // 1. Inicializar Arweave para navegadores mediante la ventana global
        const arweave = window.Arweave.init({
            host: 'arweave.net',
            port: 443,
            protocol: 'https'
        });

        let userAddress = "";

        // Captura e inyección segura de elementos del DOM
        const btnConnect = document.getElementById('btnConnect');
        const statusLabel = document.getElementById('status');
        const txtAddress = document.getElementById('txtAddress');
        const fileInput = document.getElementById('fileInput');
        const btnSubmit = document.getElementById('btnSubmit');
        const uploadResult = document.getElementById('uploadResult');

        // --- EVENTO 1: CONECTAR BILLETERA WANDER ---
        btnConnect.addEventListener('click', async () => {
            if (!window.arweaveWallet) {
                alert("Por favor instala la extensión de la billetera Wander (ArConnect).");
                return;
            }
            try {
                statusLabel.innerText = "Conectando...";
                
                // Permisos oficiales en mayúsculas aprobados por Wander
                await window.arweaveWallet.connect(["ACCESS_ADDRESS", "SIGN_TRANSACTION"]);
                
                userAddress = await window.arweaveWallet.getActiveAddress();
                
                txtAddress.innerText = userAddress;
                statusLabel.innerText = "Conectado";
                statusLabel.style.color = "green";
                
                // Desbloqueamos los controles físicos
                fileInput.disabled = false;
                btnSubmit.disabled = false;
                uploadResult.innerText = "";
            } catch (err) {
                console.error("Error al conectar:", err);
                statusLabel.innerText = "Error al conectar";
                statusLabel.style.color = "red";
            }
        });

        // --- EVENTO 2: FIRMAR Y SUBIR ARCHIVO DIRECTO A ARWEAVE ---
        btnSubmit.addEventListener('click', async () => {
            const files = fileInput.files;
            
            // CORRECCIÓN CRÍTICA: Validación estricta del array de selección
            if (!files || files.length === 0) {
                alert("Por favor, selecciona un archivo primero.");
                return;
            }
            
            // Extraer el archivo plano legítimo
            const file = files[0]; 
            uploadResult.innerText = "Leyendo archivo en memoria...";
            uploadResult.style.color = "blue";
            
            try {
                const reader = new FileReader();
                
                // Leer el archivo como ArrayBuffer nativo
                reader.readAsArrayBuffer(file);
                
                reader.onload = async (e) => {
                    try {
                        const arrayBuffer = e.target.result;
                        uploadResult.innerText = "Creando transacción oficial...";

                        // 1. Instanciamos la transacción inyectando los bytes reales para calcular costos exactos
                        const transaction = await arweave.createTransaction({
                            data: arrayBuffer 
                        });

                        // 2. Insertamos la etiqueta criptográfica del archivo
                        transaction.addTag('Content-Type', file.type || 'application/octet-stream');
                        
                        uploadResult.innerText = "Esperando aprobación en el pop-up de Wander...";

                        // 3. Invocar la firma segura (Wander calcula AR en base a data de forma nativa)
                        await arweave.transactions.sign(transaction, "use_wallet");
                        
                        uploadResult.innerText = "Transmitiendo datos directo a la Permaweb...";

                        // 4. Publicar la transacción firmada e íntegra directamente desde el cliente hacia los nodos
                        const response = await arweave.transactions.post(transaction);
                        console.log(">>> Estatus recibido de la red Arweave:", response.status);

                        // 5. Los códigos 200 y 202 significan éxito en el protocolo descentralizado
                        if (response.status === 200 || response.status === 202) {
                            uploadResult.innerHTML = `¡Éxito absoluto! Archivo subido.<br>ID: <a href="https://viewblock.io{transaction.id}" target="_blank" style="color: green; font-weight: bold;">${transaction.id}</a>`;
                            uploadResult.style.color = "green";
                        } else {
                            uploadResult.innerText = `La red Arweave rechazó el paquete. Código: ${response.status}`;
                            uploadResult.style.color = "red";
                        }
                    } catch (innerErr) {
                        console.error("Error dentro del cargador del archivo:", innerErr);
                        uploadResult.innerText = "Error en firma/envío: " + innerErr.message;
                        uploadResult.style.color = "red";
                    }
                };
                
            } catch (err) {
                console.error("Error en el proceso de subida:", err);
                uploadResult.innerText = "Error en el proceso: " + err.message;
                uploadResult.style.color = "red";
            }
        });
    </script>
</body>
</html>
