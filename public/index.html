    <!-- Lógica de Frontend - Bloque A -->
    <script>
        // Inicializar Arweave apuntando al gateway oficial de la red principal
        const arweave = Arweave.init({
            host: 'arweave.net',
            port: 443,
            protocol: 'https'
        });

        // Captura de componentes de la interfaz de usuario
        const walletInput = document.getElementById('walletInput');
        const walletLabel = document.getElementById('walletLabel');
        const walletIcon = document.getElementById('walletIcon');
        const addressBox = document.getElementById('addressBox');
        const txtAddress = document.getElementById('txtAddress');
        
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadForm = document.getElementById('uploadForm');
        const statusMessage = document.getElementById('statusMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnRefresh = document.getElementById('btnRefresh');
        const filesTableBody = document.getElementById('filesTableBody');
        const loadingList = document.getElementById('loadingList');

        const txtBalance = document.getElementById('txtBalance');
        const calcSize = document.getElementById('calcSize');
        const calcUnit = document.getElementById('calcUnit');
        const calcRes = document.getElementById('calcRes');

        // Estado global de la sesión del usuario en el cliente
        let userAddress = "";

        // MODIFICACIÓN WEB3: Interectar la zona de arrastre para conectarse directo a Wander
        walletInput.addEventListener('click', async (e) => {
            e.preventDefault(); // Cancelamos la lectura del archivo físico local
            
            if (!window.arweaveWallet) {
                alert("Por favor instala la extensión de la billetera Wander (ArConnect) en tu navegador.");
                window.open("https://wander.app", "_blank");
                return;
            }

            walletLabel.innerText = "Conectando...";
            try {
                // Solicitar permisos nativos seguros a la extensión del navegador
                await window.arweaveWallet.connect(["ACCESS_ADDRESS", "ACCESS_BALANCE", "SIGN_TRANSACTION"]);
                
                // Extraer la clave pública de la sesión activa de Wander
                userAddress = await window.arweaveWallet.getActiveAddress();
                
                // Actualizar la interfaz visual con los estilos oscuros establecidos
                walletLabel.innerText = "Wander Conectado";
                walletLabel.style.color = "#34d399";
                walletIcon.innerText = "🦊";
                txtAddress.innerText = userAddress;
                addressBox.style.display = "block";
                
                // Habilitar el botón principal para proceder con el guardado
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Subir a la Red Principal";
                btnSubmit.style.cursor = "pointer";
                btnSubmit.style.opacity = "1";

                checkArweaveBalance();
                loadFiles();
            } catch (err) {
                console.error(err);
                walletLabel.innerText = "Error de Conexión";
                walletIcon.innerText = "❌";
            }
        });

        // Consultar balance directo enlazado a la dirección pública activa de Wander
        async function checkArweaveBalance() {
            if (!userAddress) return;
            try {
                const winstonBalance = await arweave.wallets.getBalance(userAddress);
                const arBalance = arweave.ar.winstonToAr(winstonBalance);
                txtBalance.innerText = parseFloat(arBalance).toFixed(6);
            } catch (err) {
                console.error("Error consultando balance:", err);
            }
        }

        // Consultar cotización de red a través de tu endpoint de Render
        async function calculateCost(totalBytes) {
            if (!totalBytes || totalBytes <= 0) {
                calcRes.innerText = "0.000000";
                return;
            }
            try {
                const response = await fetch("/api/price/" + totalBytes);
                const data = await response.json();
                if (data.success) {
                    calcRes.innerText = parseFloat(data.ar).toFixed(6);
                }
            } catch (err) {
                console.error("Error calculando tarifa:", err);
            }
        }
       // Detectar el tamaño del archivo de forma automática al seleccionarlo
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0]; // Acceso estricto al archivo real
                fileLabel.innerText = `Seleccionado: ${file.name}`;
                fileLabel.style.color = '#fbbf24';
                fileLabel.style.fontWeight = '600';

                const sizeInBytes = file.size; 
                if (sizeInBytes < 1024) {
                    calcSize.value = sizeInBytes;
                    calcUnit.value = "B";
                } else if (sizeInBytes < 1024 * 1024) {
                    calcSize.value = (sizeInBytes / 1024).toFixed(2);
                    calcUnit.value = "KB";
                } else {
                    calcSize.value = (sizeInBytes / (1024 * 1024)).toFixed(2);
                    calcUnit.value = "MB";
                }

                calculateCost(sizeInBytes);
            }
        });

        // 4. CREAR, DISPARAR FIRMA ASÍNCRONA EN WANDER Y TRANSMITIR
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userAddress) {
                alert("Por favor conecta tu billetera Wander primero.");
                return;
            }

            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Abriendo Wander para firmar...";
            showMessage('Abriendo la extensión Wander. Por favor aprueba la firma de la transacción...', 'msg-blue');

            try {
                const fileReader = new FileReader();
                fileReader.onload = async (event) => {
                    try {
                        const arrayBuffer = event.target.result;
                        const dataBuffer = new Uint8Array(arrayBuffer);

                        const priceResponse = await fetch("/api/price/" + dataBuffer.length);
                        const priceData = await priceResponse.json();
                        
                        if (!priceData.success) throw new Error("No se pudo estimar la recompensa.");

                        const baseWinston = arweave.ar.arToWinston(priceData.ar);
                        const boostedReward = (BigInt(baseWinston) * 14n / 10n).toString();

                        // A. Crear la estructura básica de la transacción sin pasarle clave privada
                        const transaction = await arweave.createTransaction({
                            data: dataBuffer,
                            reward: boostedReward
                        });

                        transaction.addTag('Content-Type', file.type || 'application/octet-stream');
                        transaction.addTag('App-Name', 'MiArweaveUploaderBasico');
                        transaction.addTag('File-Name', file.name);

                        // B. EJECUCIÓN CON WANDER: Abre la ventana emergente asíncrona segura de la extensión
                        // Evita el bloqueo del hilo principal y congela la pestaña de Chrome
                        await arweave.transactions.sign(transaction, "use_wallet");

                        showMessage('Transacción firmada con Wander. Transmitiendo bytes seguros...', 'msg-blue');
                        btnSubmit.innerText = "Transmitiendo a Render...";

                        // C. Enviar la transacción firmada a tu backend puente
                        const response = await fetch('/api/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ transactionData: transaction })
                        });
                        
                        const serverData = await response.json();

                        if (serverData.success) {
                            showMessage(`🎉 ¡Completado! Transmitido con éxito. ID: ${serverData.txId}`, 'msg-green');
                            uploadForm.reset();
                            fileLabel.innerText = "Arrastra tu archivo aquí o haz clic para buscar";
                            fileLabel.style.color = '#94a3b8';
                            fileLabel.style.fontWeight = '400';
                            calcSize.value = '';
                            calcRes.innerText = "0.000000";

                            setTimeout(() => { loadFiles(); checkArweaveBalance(); }, 4000);
                        } else {
                            showMessage(`❌ Error en transmisión: ${serverData.error}`, 'msg-red');
                        }
                    } catch (err) {
                        showMessage(`❌ Error criptográfico: ${err.message}`, 'msg-red');
                    } finally {
                        btnSubmit.disabled = false;
                        btnSubmit.innerText = "Subir a la Red Principal";
                    }
                };
                fileReader.readAsArrayBuffer(file);
            } catch (err) {
                showMessage(`❌ Fallo al procesar archivo temporal`, 'msg-red');
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Subir a la Red Principal";
            }
        });

        // 5. Cargar lista de archivos de la billetera activa
        async function loadFiles() {
            if (!userAddress) return;
            loadingList.style.display = 'block';
            filesTableBody.innerHTML = '';
            
            try {
                const response = await fetch('/api/files/' + userAddress);
                const data = await response.json();
                
                if (data.success && data.files.length > 0) {
                    data.files.forEach(file => {
                        const tr = document.createElement('tr');
                        tr.className = "data-row";
                        tr.innerHTML = `
                            <td style="padding: 16px; font-weight: 500; max-width: 200px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">` + file.name + `</td>
                            <td style="padding: 16px; color: #94a3b8; font-family: monospace; font-size: 0.75rem;">` + file.type + `</td>
                            <td style="padding: 16px; text-align: right;">
                                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                                    <a href="` + file.txUrl + `" target="_blank" class="btn-download" style="color: #60a5fa; border-color: rgba(51,65,85,0.8);">🔍 Ver TX</a>
                                    <a href="` + file.url + `" target="_blank" class="btn-download">⬇️ Ver Archivo</a>
                                </div>
                            </td>
                        `;
                        filesTableBody.appendChild(tr);
                    });
                } else {
                    filesTableBody.innerHTML = `<tr><td colspan="3" class="text-center text-slate-500 py-8">No se encontraron archivos subidos por esta billetera todavía.</td></tr>`;
                }
            } catch (err) {
                filesTableBody.innerHTML = `<tr><td colspan="3" class="text-center text-rose-400 py-8">Error al cargar la lista.</td></tr>`;
            } finally {
                loadingList.style.display = 'none';
            }
        }

        btnRefresh.addEventListener('click', () => { loadFiles(); checkArweaveBalance(); });
    </script>
</body>
</html>
