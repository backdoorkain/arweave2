<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subidor Arweave Minimalista</title>
    <!-- SDK oficial de Arweave cargado correctamente -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        button { padding: 10px 15px; cursor: pointer; margin-right: 10px; }
        #status { font-weight: bold; color: blue; }
    </style>
</head>
<body>

    <h2>Subidor Arweave Minimalista</h2>
    <p>Estado actual: <span id="status">Desconectado</span></p>

    <!-- BLOQUE 1: Conexión de Billetera -->
    <div class="box">
        <h3>1. Billetera Wander</h3>
        <button id="btnConnect">Conectar Wander</button>
        <p>Dirección: <span id="txtAddress">Ninguna</span></p>
    </div>

    <!-- BLOQUE 2: Carga y Envío del Archivo -->
    <div class="box">
        <h3>2. Subir Archivo a la Permaweb</h3>
        <input type="file" id="fileInput" disabled><br><br>
        <button id="btnSubmit" disabled>Firmar y Subir Archivo</button>
        <p id="uploadResult"></p>
    </div>

    <script>
        // Inicializar el SDK oficial de Arweave apuntando a la red principal
        const arweave = Arweave.init({
            host: 'arweave.net',
            port: 443,
            protocol: 'https'
        });

        let userAddress = "";

        // Elementos del DOM
        const btnConnect = document.getElementById('btnConnect');
        const statusLabel = document.getElementById('status');
        const txtAddress = document.getElementById('txtAddress');
        const fileInput = document.getElementById('fileInput');
        const btnSubmit = document.getElementById('btnSubmit');
        const uploadResult = document.getElementById('uploadResult');

        // --- EVENTO 1: CONECTAR WANDER ---
        btnConnect.addEventListener('click', async () => {
            if (!window.arweaveWallet) {
                alert("Por favor instala la extensión Wander.");
                return;
            }

            try {
                statusLabel.innerText = "Conectando...";
                
                // Pedimos únicamente los permisos indispensables para conectar y firmar transacciones
                await window.arweaveWallet.connect(["ACCESS_ADDRESS", "SIGN_TRANSACTION"]);
                
                // Obtenemos la llave pública activa
                userAddress = await window.arweaveWallet.getActiveAddress();
                
                // Actualizamos la interfaz minimalista
                txtAddress.innerText = userAddress;
                statusLabel.innerText = "Conectado";
                statusLabel.style.color = "green";
                
                // Habilitamos los controles del archivo
                fileInput.disabled = false;
                btnSubmit.disabled = false;
            } catch (err) {
                console.error("Error al conectar:", err);
                statusLabel.innerText = "Error al conectar b联";
                statusLabel.style.color = "red";
            }
        });

        // --- EVENTO 2: FIRMAR Y SUBIR ARCHIVO ---
        btnSubmit.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Por favor, selecciona un archivo primero.");
                return;
            }

            uploadResult.innerText = "Procesando archivo...";

            try {
                // 1. Leer el archivo en el navegador como ArrayBuffer binario
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                
                reader.onload = async (e) => {
                    const arrayBuffer = e.target.result;
                    
                    uploadResult.innerText = "Creando transacción en Arweave...";
                    
                    // 2. Crear la transacción base sin la data binaria pesada (para que pase rápido a Wander)
                    const transaction = await arweave.transactions.create({
                        data: 'PLACEHOLDER_DATA' 
                    });

                    // 3. Añadir la etiqueta (Tag) del tipo de archivo (Content-Type)
                    transaction.addTag('Content-Type', file.type || 'application/octet-stream');

                    uploadResult.innerText = "Esperando firma en el pop-up de Wander...";
                    
                    // 4. INVOCA CORRECTAMENTE EL POP-UP DE WANDER PARA FIRMAR
                    await arweave.transactions.sign(transaction, "use_wallet");

                    uploadResult.innerText = "Archivo firmado. Enviando al servidor...";

                    // 5. Convertir el archivo real a Base64 para mandarlo seguro a tu backend
                    const uint8Array = new Uint8Array(arrayBuffer);
                    let binaryString = "";
                    for (let i = 0; i < uint8Array.length; i++) {
                        binaryString += String.fromCharCode(uint8Array[i]);
                    }
                    const fileBufferBase64 = btoa(binaryString);

                    // 6. Enviar la transacción firmada junto con el archivo real a tu server.js
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            transactionData: transaction, // Objeto estructurado con las firmas criptográficas
                            fileBufferBase64: fileBufferBase64 // El binario real del archivo
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        uploadResult.innerHTML = `¡Éxito! Tx ID: <a href="https://viewblock.io{data.txId}" target="_blank">${data.txId}</a>`;
                        uploadResult.style.color = "green";
                    } else {
                        uploadResult.innerText = "Error en servidor: " + data.error;
                        uploadResult.style.color = "red";
                    }
                };
                
            } catch (err) {
                console.error("Error en el proceso de subida:", err);
                uploadResult.innerText = "Error en el proceso: " + err.message;
                uploadResult.style.color = "red";
            }
        });
    </script>
</body>
</html>
